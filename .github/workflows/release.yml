name: Release

# Releases are cut from the stable branch of each Hyprland release line
# (hyprland-0.56, ...). main follows hyprland-git and is never released: every
# push to the newest stable line is merged into it, and every release pins
# itself there, since hyprpm reads its manifest from main.
on:
  push:
    branches:
      - "hyprland-*"

concurrency:
  # One group for every line: each run pushes to main.
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip changelog commits to avoid infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    container:
      image: archlinux:latest
    outputs:
      skip: ${{ steps.version-bump.outputs.skip }}
      new_version: ${{ steps.version-bump.outputs.new_version }}
      hyprland_version: ${{ steps.hyprland-version.outputs.version }}
      release_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            base-devel \
            hyprland \
            pixman \
            libdrm \
            pkgconf \
            wget

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine version bump from conventional commits
        id: version-bump
        run: |
          # Last release of this line: a tag reachable from the branch, not the
          # newest tag of the repository.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)

          if [[ -z "$LAST_TAG" ]]; then
            echo "No previous release found"
            COMMITS=$(git log --oneline --no-merges)
            CURRENT_VERSION="0.0.0"
          else
            echo "Last release: ${LAST_TAG}"
            COMMITS=$(git log --oneline --no-merges "${LAST_TAG}..HEAD")
            CURRENT_VERSION=$(echo "$LAST_TAG" | sed 's/^v//')
            # The version is computed from it and reaches later shell steps.
            if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The last release tag ${LAST_TAG} is not vX.Y.Z."
              exit 1
            fi
          fi

          echo "Current version: ${CURRENT_VERSION}"
          echo "Commits since last release:"
          echo "$COMMITS"

          BUMP_TYPE="none"

          if echo "$COMMITS" | grep -qiE '(BREAKING CHANGE|^[a-f0-9]+ [a-z]+(\(.*\))?!:)'; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE '^[a-f0-9]+ feat'; then
            BUMP_TYPE="minor"
          elif echo "$COMMITS" | grep -qiE '^[a-f0-9]+ (fix|perf|build)'; then
            BUMP_TYPE="patch"
          fi

          echo "Bump type: ${BUMP_TYPE}"

          if [[ "$BUMP_TYPE" == "none" ]]; then
            echo "::notice::No releasable commits found (need feat, fix, perf, build, or breaking change). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "New version: ${NEW_VERSION}"

          echo "bump_type=${BUMP_TYPE}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Capture Hyprland version
        if: steps.version-bump.outputs.skip != 'true'
        id: hyprland-version
        run: |
          HYPRLAND_VERSION=$(pacman -Q hyprland | awk '{print $2}' | cut -d'-' -f1)
          LINE="${GITHUB_REF_NAME#hyprland-}"

          # The binary and the pin must match the line this branch targets. Once
          # Arch ships the next Hyprland release, this line can no longer be
          # released by CI.
          if [[ "$HYPRLAND_VERSION" != "$LINE".* ]]; then
            echo "::error::Arch ships Hyprland ${HYPRLAND_VERSION}, but ${GITHUB_REF_NAME} targets Hyprland ${LINE}.x."
            exit 1
          fi

          # The pin goes to the Hyprland the binary was built against: it must
          # be the one this commit declares.
          DECLARED=$(tr -d '[:space:]' < .hyprland-version)
          if [[ "$HYPRLAND_VERSION" != "$DECLARED" ]]; then
            echo "::error::Arch ships Hyprland ${HYPRLAND_VERSION}, but .hyprland-version says ${DECLARED}: push again once they match."
            exit 1
          fi

          # Without a release tag in the headers, the binary can't tell which
          # Hyprland it was built for and skips its version check.
          if ! grep -Eq '^#define GIT_TAG +"v[0-9]+\.[0-9]+\.[0-9]+"' /usr/include/hyprland/src/version.h; then
            echo "::error::The Hyprland headers carry no release tag."
            exit 1
          fi

          echo "version=${HYPRLAND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built against Hyprland ${HYPRLAND_VERSION}"

      - name: Build plugin
        if: steps.version-bump.outputs.skip != 'true'
        env:
          HYPRGLASS_VERSION: ${{ steps.version-bump.outputs.new_version }}
        run: make HYPRGLASS_VERSION="$HYPRGLASS_VERSION"

      - name: Install git-chglog
        if: steps.version-bump.outputs.skip != 'true'
        run: |
          CHGLOG_VERSION="0.15.4"
          # Unpack outside the repository: the archive ships its own README and LICENSE.
          mkdir -p "$RUNNER_TEMP/git-chglog"
          wget -qO "$RUNNER_TEMP/git-chglog.tar.gz" "https://github.com/git-chglog/git-chglog/releases/download/v${CHGLOG_VERSION}/git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz"
          tar xzf "$RUNNER_TEMP/git-chglog.tar.gz" -C "$RUNNER_TEMP/git-chglog"
          mv "$RUNNER_TEMP/git-chglog/git-chglog" /usr/local/bin/

      - name: Generate changelog
        if: steps.version-bump.outputs.skip != 'true'
        id: changelog
        run: |
          NEW_TAG="${{ steps.version-bump.outputs.tag }}"

          # Create temporary tag for git-chglog to pick up
          git tag "$NEW_TAG"

          git-chglog --config .chglog/config.yml --output CHANGELOG.md

          # Remove temporary tag (GitHub release will create the real one)
          git tag -d "$NEW_TAG"

          echo "Generated CHANGELOG.md"

          # Extract changelog content for release body (first 100 lines)
          CHANGELOG_CONTENT=$(head -100 CHANGELOG.md)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        if: steps.version-bump.outputs.skip != 'true'
        id: commit
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore(release): v${{ steps.version-bump.outputs.new_version }} [skip ci]" \
              -m "Bump version from ${{ steps.version-bump.outputs.current_version }} to ${{ steps.version-bump.outputs.new_version }}" \
              -m "Update CHANGELOG.md"

            git push https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "HEAD:${GITHUB_REF_NAME}"
            echo "Changelog committed and pushed"
          fi

          # The commit the release tag and the hyprpm pin point to.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifact
        if: steps.version-bump.outputs.skip != 'true'
        run: |
          mkdir -p release
          cp hyprglass.so release/

      - name: Create GitHub Release
        if: steps.version-bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version-bump.outputs.tag }}
          # Without it the tag lands on the default branch (main), i.e. on hyprland-git code.
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: "HyprGlass ${{ steps.version-bump.outputs.tag }}"
          body: |
            ## HyprGlass ${{ steps.version-bump.outputs.tag }}

            **Hyprland compatibility**: `${{ steps.hyprland-version.outputs.version }}`

            > [!IMPORTANT]
            > This pre-built binary was compiled against Hyprland **${{ steps.hyprland-version.outputs.version }}**.
            > If you are running a different Hyprland version, build from source or use `hyprpm` instead.

            ### Installation

            ```bash
            # Download the pre-built plugin
            wget -O hyprglass.so https://github.com/${{ github.repository }}/releases/download/${{ steps.version-bump.outputs.tag }}/hyprglass.so

            # Load it
            hyprctl plugin load $(pwd)/hyprglass.so
            ```

            Or build from source with [hyprpm](https://wiki.hyprland.org/Plugins/Using-Plugins/#hyprpm):
            ```bash
            hyprpm add https://github.com/${{ github.repository }}
            hyprpm enable hyprglass
            ```

            ---

            ${{ steps.changelog.outputs.changelog }}
          files: |
            release/hyprglass.so
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.version-bump.outputs.skip != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release Summary

          | Property | Value |
          |----------|-------|
          | Version | \`${{ steps.version-bump.outputs.tag }}\` |
          | Previous | \`v${{ steps.version-bump.outputs.current_version }}\` |
          | Bump Type | \`${{ steps.version-bump.outputs.bump_type }}\` |
          | Branch | \`${{ github.ref_name }}\` |
          | Hyprland | \`${{ steps.hyprland-version.outputs.version }}\` |
          | Release | [${{ steps.version-bump.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version-bump.outputs.tag }}) |
          EOF

  forward-merge:
    # After the release, so its changelog commit goes along; before the pin, so
    # the pin lands on top of the merge. The pin still runs when the merge is
    # left to a pull request: users get the release meanwhile.
    needs: release
    if: "!cancelled() && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    container:
      image: archlinux:latest
    steps:
      # hyprland-git and its -git dependencies come prebuilt from Chaotic-AUR.
      - name: Enable Chaotic-AUR
        run: |
          pacman-key --init
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            base-devel \
            hyprland-git \
            pixman \
            libdrm \
            pkgconf \
            github-cli

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORWARD_MERGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # GITHUB_TOKEN can't push a change to .github/workflows, and its pull
      # requests start no CI run: FORWARD_MERGE_TOKEN (contents, workflows and
      # pull-requests write) lifts both.
      - name: Merge into main
        env:
          GH_TOKEN: ${{ secrets.FORWARD_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Frozen lines stay out of main: only the newest stable line flows into it.
          NEWEST=$(git ls-remote --heads origin | awk '{print $2}' \
            | sed -n 's|^refs/heads/\(hyprland-[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -n 1)
          if [[ -z "$NEWEST" ]]; then
            echo "::error::Could not list the stable branches."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$NEWEST" ]]; then
            echo "::notice::${GITHUB_REF_NAME} is not the newest stable line (${NEWEST}): not merged into main."
            exit 0
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git fetch origin main "$GITHUB_REF_NAME"
          STABLE="origin/${GITHUB_REF_NAME}"
          if git merge-base --is-ancestor "$STABLE" origin/main; then
            echo "main already has ${GITHUB_REF_NAME}"
            exit 0
          fi

          git checkout -B forward-merge origin/main

          # Held back only when the merge breaks a main that built: main can
          # trail hyprland-git, and that isn't this merge's fault.
          MAIN_BUILDS=false
          if make; then MAIN_BUILDS=true; fi
          make clean

          PROBLEM=""
          if ! git merge --no-ff --no-edit -m "Merge branch '${GITHUB_REF_NAME}' into main" "$STABLE"; then
            # A merge refused before it started leaves no MERGE_HEAD to abort.
            git merge --abort || true
            git checkout -f -B forward-merge "$STABLE"
            git clean -fdq
            PROBLEM="it conflicts with main"
          elif [[ "$MAIN_BUILDS" == true ]] && ! make; then
            PROBLEM="main no longer builds against hyprland-git after it"
          fi

          if [[ -z "$PROBLEM" ]]; then
            if git push "$REMOTE" HEAD:main; then
              echo "Merged ${GITHUB_REF_NAME} into main"
              exit 0
            fi
            PROBLEM="the push to main was rejected (main moved, or a workflow file changed and FORWARD_MERGE_TOKEN isn't set)"
          fi

          # A person finishes the merge on its own branch: never on the stable one.
          BRANCH="forward-merge/${GITHUB_REF_NAME}"
          OPEN_PR=$(gh pr list --repo "${{ github.repository }}" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$OPEN_PR" ]]; then
            gh pr comment "$OPEN_PR" --repo "${{ github.repository }}" \
              --body "${GITHUB_REF_NAME} moved on to ${GITHUB_SHA:0:12}: merge it into this branch as well."
          else
            if ! git push --force "$REMOTE" "HEAD:refs/heads/${BRANCH}"; then
              echo "::error::${GITHUB_REF_NAME} was not merged into main (${PROBLEM}), and ${BRANCH} could not be pushed. Merge it by hand: git fetch origin && git checkout main && git merge --no-ff origin/${GITHUB_REF_NAME} && git push origin main"
              exit 1
            fi
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "Merge ${GITHUB_REF_NAME} into main" \
              --body "${GITHUB_REF_NAME} could not be merged into main automatically: ${PROBLEM}. Finish the merge on this branch (merge main into it, adapt to hyprland-git), then merge this pull request."
          fi
          echo "::warning::${GITHUB_REF_NAME} was not merged into main: ${PROBLEM}. See the forward-merge pull request."

  pin:
    needs: [release, forward-merge]
    if: "!cancelled() && needs.release.result == 'success' && needs.release.outputs.skip == 'false'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the release for hyprpm on main
        run: |
          VERSION="${{ needs.release.outputs.hyprland_version }}"
          NEW_VERSION="${{ needs.release.outputs.new_version }}"
          RELEASE_COMMIT="${{ needs.release.outputs.release_commit }}"

          # Resolve the Hyprland release tag to its commit hash.
          HYPRLAND_COMMIT=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/hyprwm/Hyprland/commits/v${VERSION}" \
            | jq -r '.sha // empty')

          if [[ -z "$HYPRLAND_COMMIT" ]]; then
            echo "::error::Could not resolve Hyprland v${VERSION} to a commit: add its pin to main's hyprpm.toml by hand."
            exit 1
          fi

          PIN_LINE="  [\"${HYPRLAND_COMMIT}\", \"${RELEASE_COMMIT}\"], # hyprland ${VERSION} -> hyprglass v${NEW_VERSION}"
          echo "Pin: ${PIN_LINE}"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Replace this Hyprland commit's pin, or add it before the closing bracket.
            awk -v pin="$PIN_LINE" -v key="\"${HYPRLAND_COMMIT}\"" '
              /^commit_pins = \[/          { inblock = 1 }
              inblock && index($0, key)    { print pin; pinned = 1; next }
              inblock && /^\]/             { if (!pinned) print pin; inblock = 0 }
              { print }
            ' hyprpm.toml > hyprpm.toml.tmp && mv hyprpm.toml.tmp hyprpm.toml

            if git diff --quiet hyprpm.toml; then
              echo "Pin already up to date"
              exit 0
            fi

            git add hyprpm.toml
            git commit -m "chore(release): pin hyprland ${VERSION} to v${NEW_VERSION} [skip ci]"

            if git push https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main; then
              echo "Pin pushed to main"
              exit 0
            fi

            echo "Push to main rejected (attempt ${attempt}), retrying"
            sleep 5
          done

          echo "::error::Could not push the pin to main: add it by hand: ${PIN_LINE}"
          exit 1
